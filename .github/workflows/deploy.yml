name: Desplegar

# Workflow reutilizable: despliega una imagen ya publicada en la VM de MS02, con el runner self-hosted de etiqueta
# "ms02" y las variables y secretos del Environment ms02-<entorno>. Lo llaman ci.yml (test) y deploy-prod.yml.
on:
  workflow_call:
    inputs:
      entorno:
        description: test o prod
        type: string
        required: true
      ref:
        description: Commit del que se toman los archivos de infra/
        type: string
        required: true
      tag:
        description: Imagen a desplegar (sha-xxxxxxx). Vacía = la del commit de ref.
        type: string
        required: false
        default: ''

jobs:
  desplegar:
    runs-on: [self-hosted, ms02]
    environment: ms02-${{ inputs.entorno }}
    timeout-minutes: 15
    concurrency:
      group: desplegar-ms02-${{ inputs.entorno }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Desplegar y verificar
        run: infra/deploy.sh
        env:
          ENTORNO: ${{ inputs.entorno }}
          TAG: ${{ inputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          QR_BASE_URL: ${{ vars.QR_BASE_URL }}
          NAVIGATION_BASE_URL: ${{ vars.NAVIGATION_BASE_URL }}
          NAVIGATION_PROFILE: ${{ vars.NAVIGATION_PROFILE }}
          MS02_EXTRA_ENV: ${{ vars.MS02_EXTRA_ENV }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
