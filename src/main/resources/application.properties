spring.application.name=ms02-campus-and-security
server.port=${SERVER_PORT:8082}

# Variables locales de .env (opcional). Las variables de entorno reales tienen prioridad.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=false

logging.pattern.level=%5p [%X{correlationId:-}]
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Navegación exterior
campusseguro.navigation.base-url=${NAVIGATION_BASE_URL:https://routing.openstreetmap.de/routed-foot}
campusseguro.navigation.profile=${NAVIGATION_PROFILE:foot}
campusseguro.navigation.connect-timeout=${NAVIGATION_CONNECT_TIMEOUT:3s}
campusseguro.navigation.read-timeout=${NAVIGATION_READ_TIMEOUT:10s}

# Generación automática de rutas exteriores (al crear o mover salidas y zonas seguras)
campusseguro.rutas.auto.enabled=${RUTAS_AUTO_ENABLED:true}
campusseguro.rutas.auto.max-zonas-por-salida=${RUTAS_AUTO_MAX_ZONAS:3}

# Configuración de imágenes
campusseguro.imagen.max-size-bytes=${IMAGEN_MAX_SIZE_BYTES:5242880}

# Dirección pública del frontend que va dentro de los códigos QR
campusseguro.qr.base-url=${QR_BASE_URL:http://localhost:5173}

# Almacenamiento físico de imágenes
campusseguro.imagen.storage-dir=${IMAGEN_STORAGE_DIR:./data}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
